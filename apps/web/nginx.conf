server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets are immutable. If a file is genuinely missing we
    # return 404 instead of index.html, so a broken <script> does not silently
    # load HTML with the wrong Content-Type.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router history fallback: any path that is not a real file is
    # handled by the client-side router, which renders index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML entry point, so deployments pick up new asset names.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
