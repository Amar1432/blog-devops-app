name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # gg-ignore
          POSTGRES_DB: devops_blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=@devops-blog/api

      - name: Run backend lint
        run: npm run lint:api

      - name: Configure test environment
        run: |
          cat << 'EOF' > apps/api/.env.test
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/devops_blog_test?schema=public"
          NODE_ENV=test
          PORT=4001
          CORS_ORIGIN="http://localhost:5173"
          JWT_SECRET="test-only-secret-at-least-16-characters"
          JWT_EXPIRES_IN="1h"
          ADMIN_EMAIL="admin@test.local"
          ADMIN_PASSWORD="test-password"
          ADMIN_NAME="Test Admin"
          EOF

      - name: Apply Prisma migrations
        run: npm run db:deploy --workspace=@devops-blog/api
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/devops_blog_test?schema=public"

      - name: Run backend tests
        run: npm run test --workspace=@devops-blog/api

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint:web

      - name: Run frontend tests
        run: npm run test:web

      - name: Run frontend production build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:4000/api

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: repo-owner
        run: echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo-owner.outputs.owner }}/devops-blog-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
            type=raw,value=production

      - name: Build and publish API image
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Extract metadata for Web image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo-owner.outputs.owner }}/devops-blog-web
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
            type=raw,value=production

      - name: Build and publish Web image
        id: build-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Generate build summary
        run: |
          echo "### Image Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API Image:** \`ghcr.io/${{ steps.repo-owner.outputs.owner }}/devops-blog-api:production\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API Digest:** \`${{ steps.build-api.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Image:** \`ghcr.io/${{ steps.repo-owner.outputs.owner }}/devops-blog-web:production\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Digest:** \`${{ steps.build-web.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Production via Coolify
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Coolify Deployment Webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "::error::COOLIFY_WEBHOOK secret is not configured"
            exit 1
          fi

          echo "Triggering Coolify deployment for commit ${{ github.sha }}..."

          AUTH_ARGS=()
          if [ -n "$COOLIFY_TOKEN" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer $COOLIFY_TOKEN")
          fi

          # Execute webhook call without leaking secrets in stdout
          HTTP_RESPONSE=$(curl -fsS -w "\n%{http_code}" -X POST "${AUTH_ARGS[@]}" "$COOLIFY_WEBHOOK" 2>&1)
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n 1)

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Coolify accepted deployment trigger (HTTP $HTTP_CODE)."
            echo "### CD Deployment Trigger" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** Accepted by Coolify (HTTP $HTTP_CODE)" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit Triggered:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::Coolify deployment trigger failed with HTTP $HTTP_CODE"
            exit 1
          fi
