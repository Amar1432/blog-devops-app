name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devops_blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=@devops-blog/api

      - name: Run backend lint
        run: npm run lint:api

      - name: Configure test environment
        run: |
          cat << 'EOF' > apps/api/.env.test
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/devops_blog_test?schema=public"
          NODE_ENV=test
          PORT=4001
          CORS_ORIGIN="http://localhost:5173"
          JWT_SECRET="test-only-secret-at-least-16-characters"
          JWT_EXPIRES_IN="1h"
          ADMIN_EMAIL="admin@test.local"
          ADMIN_PASSWORD="test-password"
          ADMIN_NAME="Test Admin"
          EOF

      - name: Apply Prisma migrations
        run: npm run db:deploy --workspace=@devops-blog/api
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/devops_blog_test?schema=public"

      - name: Run backend tests
        run: npm run test --workspace=@devops-blog/api

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint:web

      - name: Run frontend tests
        run: npm run test:web

      - name: Run frontend production build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:4000/api

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -f apps/api/Dockerfile -t devops-blog-api:ci .

      - name: Build frontend Docker image
        run: docker build -f apps/web/Dockerfile -t devops-blog-web:ci .
