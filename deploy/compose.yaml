# Production Docker Compose specification for DevOps Blog
# Used for manual server deployment using pre-built images from GHCR.

name: devops-blog-prod

# -----------------------------------------------------------------------------
# Reusable Bounded Logging Definition
# Prevents unbounded Docker container log growth on the host disk.
# -----------------------------------------------------------------------------
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    # Security: No host ports mapped. The database is strictly accessible
    # to services on the private backend-network only.
    volumes:
      - ${POSTGRES_DATA_PATH:-/var/lib/docker/volumes/devops-blog-prod-postgres-data/_data}:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Express API (Node.js 22)
  # ---------------------------------------------------------------------------
  api:
    image: ${API_IMAGE:-ghcr.io/amar1432/devops-blog-api:production}
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    # Security: No host port mapped. Traffic is proxied internally via the reverse proxy.
    networks:
      - backend-network
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://luffydev.duckdns.org,http://luffydev.duckdns.org}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Site Admin}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Web Frontend (Nginx serving React)
  # ---------------------------------------------------------------------------
  web:
    image: ${WEB_IMAGE:-ghcr.io/amar1432/devops-blog-web:production}
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    # Security: No host port mapped. Traffic is proxied internally via the reverse proxy.
    networks:
      - backend-network
    environment:
      # Use relative path /api so browser fetches from the same origin
      VITE_API_URL: ${VITE_API_URL:-/api}
    # At container boot, replace the baked fallback with the runtime public URL in static JS assets
    command:
      [
        "sh",
        "-c",
        "if [ -n \"$$VITE_API_URL\" ]; then sed -i \"s|http://localhost:5000/api|$$VITE_API_URL|g\" /usr/share/nginx/html/assets/*.js; fi && exec nginx -g 'daemon off;'",
      ]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (Edge TLS termination & routing)
  # ---------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    # Edge entry point: Only ports 80 and 443 are published to the host
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF_PATH:-/opt/devops-blog/nginx/default.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${CERTBOT_ETC_PATH:-/var/lib/docker/volumes/devops-blog-prod-certbot-etc/_data}:/etc/letsencrypt
      - ${CERTBOT_WWW_PATH:-/var/lib/docker/volumes/devops-blog-prod-certbot-www/_data}:/var/www/certbot
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Certbot (ACME client for Let's Encrypt TLS certificates)
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    volumes:
      - ${CERTBOT_ETC_PATH:-/var/lib/docker/volumes/devops-blog-prod-certbot-etc/_data}:/etc/letsencrypt
      - ${CERTBOT_WWW_PATH:-/var/lib/docker/volumes/devops-blog-prod-certbot-www/_data}:/var/www/certbot
    networks:
      - backend-network

  # ---------------------------------------------------------------------------
  # Uptime Kuma (Availability & Health Monitoring)
  # ---------------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Security: Bind strictly to loopback (127.0.0.1).
      # Never expose port 3001 to 0.0.0.0 or through the public reverse proxy.
      # Access locally via SSH tunnel: ssh -L 3001:127.0.0.1:3001 <user>@<host>
      - "127.0.0.1:${UPTIME_KUMA_HOST_PORT:-3001}:3001"
    volumes:
      - ${UPTIME_KUMA_DATA_PATH:-/var/lib/docker/volumes/devops-blog-prod-uptime-kuma-data/_data}:/app/data
    networks:
      - backend-network

  # ---------------------------------------------------------------------------
  # Prometheus (Metrics Collector)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Security: Bind strictly to loopback (127.0.0.1).
      # Access locally via SSH tunnel: ssh -L 9090:127.0.0.1:9090 <user>@<host>
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ${PROMETHEUS_CONFIG_PATH:-./monitoring/prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ${PROMETHEUS_DATA_PATH:-/var/lib/docker/volumes/devops-blog-prod-prometheus-data/_data}:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=5GB"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          memory: 200M
    networks:
      - backend-network

  # ---------------------------------------------------------------------------
  # Grafana (Metrics & Performance Dashboard)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Security: Bind strictly to loopback (127.0.0.1).
      # Access locally via SSH tunnel: ssh -L 3000:127.0.0.1:3000 <user>@<host>
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-${ADMIN_PASSWORD:-admin}}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    volumes:
      - ${GRAFANA_PROVISIONING_PATH:-./monitoring/grafana/provisioning}:/etc/grafana/provisioning:ro
      - ${GRAFANA_DASHBOARDS_PATH:-./monitoring/grafana/dashboards}:/var/lib/grafana/dashboards:ro
      - ${GRAFANA_DATA_PATH:-/var/lib/docker/volumes/devops-blog-prod-grafana-data/_data}:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 150M
    depends_on:
      - prometheus
    networks:
      - backend-network

  # ---------------------------------------------------------------------------
  # Node Exporter (Host System Resource Metrics)
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.9.0
    restart: unless-stopped
    logging: *default-logging
    pid: host
    ports:
      # Security: Bind strictly to loopback (127.0.0.1)
      - "127.0.0.1:${NODE_EXPORTER_HOST_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    deploy:
      resources:
        limits:
          memory: 50M
    networks:
      - backend-network

  # ---------------------------------------------------------------------------
  # PostgreSQL Exporter (Database Metrics)
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Security: Bind strictly to loopback (127.0.0.1)
      - "127.0.0.1:${POSTGRES_EXPORTER_HOST_PORT:-9187}:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    deploy:
      resources:
        limits:
          memory: 50M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network

networks:
  backend-network:
    name: devops-blog-prod-network
    external: true
